# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
    os: ubuntu-lts-latest
    tools:
        nodejs: "latest"
    commands:
        # 1. Rust toolchain + wasm-pack (needed to build the WASM demo widget)
        - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        - source "$HOME/.cargo/env"
        - rustup target add wasm32-unknown-unknown
        - cargo install wasm-pack
        # 2. Build the WASM package (the docs' PaletteDemo widget links it via file:)
        - cd crates/wasm-bindings && wasm-pack build --release --target web
        - cd ../..
        # 3. Build the Astro / Starlight docs site
        - cd docs && npm ci
        - npm run build
        # 4. Move the built site to Read the Docs' output location
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - mv dist "$READTHEDOCS_OUTPUT/html"
