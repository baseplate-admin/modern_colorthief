# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
    os: ubuntu-lts-latest
    tools:
        # Read the Docs installs these itself (asdf/managed toolchains) and puts
        # them on PATH for every build command -- no rustup bootstrap needed.
        nodejs: "latest"
        rust: "latest"
    commands:
        # NOTE: each command below runs in its own clean shell and starts at the
        # repo root, so multi-step work must be chained with `&&` or a block.
        # 1. WASM package that the docs' `file:` dependency points at
        - |
            set -e
            rustup target add wasm32-unknown-unknown
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
            export PATH="$HOME/.cargo/bin:$PATH"
            cd crates/wasm-bindings
            wasm-pack build --release --target web
        # 2. Build the Astro / Starlight docs site
        - |
            set -e
            cd docs
            npm ci
            npm run build
        # 3. Move the built site to Read the Docs' output location
        - |
            set -e
            mkdir -p "$READTHEDOCS_OUTPUT/html"
            cp -a docs/dist/. "$READTHEDOCS_OUTPUT/html/"
