[package]
name = "modern-colorthief-core-webgpu"
version.workspace = true
edition.workspace = true

[dependencies]
modern-colorthief-core = { workspace = true }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
js-sys.workspace = true
web-sys = { workspace = true, features = ["console"] }

[build-dependencies]
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
serde_json = "1"
swc_common = "25.0.0"
swc_ecma_codegen = "31.0.0"
swc_ecma_minifier = "60.0"
swc_ecma_parser = "44.0.0"
swc_ecma_transforms_typescript = "54.0.0"
swc_ecma_utils = "34.0.0"
swc_ecma_visit = "28.0.0"

[features]
