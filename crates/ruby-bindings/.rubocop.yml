AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false

Layout/LineLength:
  Max: 100

Style/FrozenStringLiteralComment:
  EnforcedStyle: always

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 20

Metrics/BlockLength:
  Max: 30
  Exclude:
    - 'spec/**/*'
    - 'Rakefile'

Lint/RaiseException:
  Enabled: false

Lint/StructNewOverride:
  Enabled: false

# RubyGems releases use an API key in GitHub Actions.
Gemspec/RequireMFA:
  Enabled: false

# The gem supports older Ruby versions than the lint tool.
Gemspec/RequiredRubyVersion:
  Enabled: false
