# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
    os: ubuntu-lts-latest
    tools:
        python: 'latest'
        rust: 'latest'
        # You can also specify other tool versions:
    jobs:
        post_install:
            # Install with docs extras
            - python -m pip install uv
            - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --group docs

# The root pyproject.toml is a uv workspace wrapper (not a buildable package),
# so do NOT `pip install .` here -- that falls back to setuptools, which sees
# bench/, crates/, fuzz/ and fails with "Multiple top-level packages discovered
# in a flat-layout". The docs deps are already installed by `uv sync --group docs`
# in the post_install job above.

# Build documentation in the "docs/" directory with Sphinx
sphinx:
    configuration: docs/conf.py
# Optionally build your docs in additional formats such as PDF and ePub
formats:
    - pdf
#    - epub

